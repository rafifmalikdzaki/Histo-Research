[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "histodae"
version = "0.1.0"
description = "Attention-enhanced dual autoencoder clustering for liver histopathological images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "altair>=5.5.0",
    "captum>=0.8.0",
    "click>=8.3.0",
    "fastplotlib>=0.5.1",
    "grad-cam>=1.5.5",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.9",
    "lightning>=2.5.5",
    "matplotlib>=3.10.6",
    "notebook>=7.4.7",
    "numpy>=1.26.4",
    "omegaconf>=2.3.0",
    "pandas>=2.3.2",
    "patchify>=0.2.3",
    "pillow>=11.0.0",
    "plotly>=6.3.1",
    "polars>=1.33.1",
    "ptflops>=0.7.5",
    "pytorch-lightning>=2.5.5",
    "pyyaml>=6.0.3",
    "rich>=14.1.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "thop>=0.1.1.post2209072238",
    "torch>=2.8.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "umap-learn>=0.5.9.post2",
    "voila>=0.5.11",
    "wandb>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.8",
]

[tool.setuptools]
package-dir = {"" = "src"}
# `histodae` is the ONLY real package. The four flat names below are thin
# compatibility shims: each one re-points `sys.modules` at the canonical
# module so `import histodata` and `from histodae.data.datasets import ...`
# resolve to the *same* module object (no duplicate class identities).
#
# The per-stage script shims (run_corrected_pipeline.py, ...) are NOT
# installed: they exist in the repo as files, for `python src/<stage>.py`
# invocation and for the remote sweep's clone-root entry point. Their
# console-script equivalents live under `histodae.cli.*`.
py-modules = ["histodata", "metadata", "clustering_metrics", "clustering_objective"]

[project.scripts]
histodae = "histodae.cli:cli"
histodae-train = "histodae.cli.train:main"
histodae-extract = "histodae.cli.extract:main"
histodae-pipeline = "histodae.cli.pipeline:main"
histodae-cluster = "histodae.cli.cluster:main"
histodae-stats = "histodae.cli.stats:main"
histodae-plots = "histodae.cli.plots:main"
histodae-tables = "histodae.cli.tables:main"
histodae-evaluate = "histodae.cli.evaluate:main"
histodae-make-hepar-csv = "histodae.cli.make_hepar_csv:main"
histodae-make-pannuke-csv = "histodae.cli.make_pannuke_csv:main"
histodae-per-magnification = "histodae.cli.per_magnification:main"
histodae-biology = "histodae.cli.biology:main"
histodae-interpretability = "histodae.cli.interpretability:main"
histodae-profile = "histodae.cli.profile:main"
histodae-regenerate-viz = "histodae.cli.regenerate_viz:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["histodae*"]

[tool.setuptools.package-data]
histodae = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# Tests import the public namespace (`histodae.*`), not the source layout.
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["histodae"]

[tool.ruff.lint.per-file-ignores]
# Late imports are intentional here: warnings filters (and the matplotlib
# backend selection) must run before the heavy third-party imports below them.
"histodae/cli/cluster.py" = ["E402"]
"histodae/cli/stats.py" = ["E402"]
"histodae/cli/plots.py" = ["E402"]
"histodae/cli/tables.py" = ["E402"]
"histodae/cli/train.py" = ["E402"]
# The flat compatibility shims deliberately import after adjusting sys.path.
"src/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/histodae/data",
    "src/histodae/clustering",
    "src/histodae/models",
    "src/histodae/stats",
    "src/histodae/io",
]
# The stable, typed boundaries are checked strictly; the heavy, dynamic
# training/analysis/CLI layers are not (they interleave with PyTorch
# Lightning and matplotlib, where the annotations buy little).
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
show_error_codes = true
