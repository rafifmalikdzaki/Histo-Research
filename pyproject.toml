[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "histodae"
version = "0.1.0"
description = "Attention-enhanced dual autoencoder clustering for liver histopathological images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "altair>=5.5.0",
    "captum>=0.8.0",
    "click>=8.3.0",
    "fastplotlib>=0.5.1",
    "grad-cam>=1.5.5",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.9",
    "lightning>=2.5.5",
    "matplotlib>=3.10.6",
    "notebook>=7.4.7",
    "numpy>=1.26.4",
    "omegaconf>=2.3.0",
    "pandas>=2.3.2",
    "patchify>=0.2.3",
    "pillow>=11.0.0",
    "plotly>=6.3.1",
    "polars>=1.33.1",
    "ptflops>=0.7.5",
    "pytorch-lightning>=2.5.5",
    "pyyaml>=6.0.3",
    "rich>=14.1.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "thop>=0.1.1.post2209072238",
    "torch>=2.8.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "umap-learn>=0.5.9.post2",
    "voila>=0.5.11",
    "wandb>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}
# Top-level src modules shipped as-is (frozen JOIV scripts import these
# names; do not rename without shims).
py-modules = ["histodata", "metadata", "clustering_metrics", "clustering_objective",
              "run_corrected_pipeline", "run_clustering_analysis",
              "compute_statistical_significance", "generate_clustering_plots",
              "generate_latex_tables", "evaluate_stats", "create_hepar_csv",
              "create_pannuke_csv", "pl_training_with_analysis_and_optimization",
              "extract_embeddings_for_clustering"]

[project.scripts]
histodae-train = "pl_training_with_analysis_and_optimization:main"
histodae-extract = "extract_embeddings_for_clustering:main"
histodae-pipeline = "run_corrected_pipeline:main"
histodae-cluster = "run_clustering_analysis:main"
histodae-stats = "compute_statistical_significance:main"
histodae-plots = "generate_clustering_plots:main"
histodae-tables = "generate_latex_tables:main"
histodae-evaluate = "evaluate_stats:main"
histodae-make-hepar-csv = "create_hepar_csv:main"
histodae-make-pannuke-csv = "create_pannuke_csv:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["models*", "utils*", "analysis*", "training*", "histodae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Late imports are intentional here: warnings filters (and the matplotlib
# backend selection) must run before the heavy third-party imports below them.
"run_clustering_analysis.py" = ["E402"]
"compute_statistical_significance.py" = ["E402"]
"generate_clustering_plots.py" = ["E402"]
"generate_latex_tables.py" = ["E402"]
"src/pl_training_with_analysis_and_optimization.py" = ["E402"]
